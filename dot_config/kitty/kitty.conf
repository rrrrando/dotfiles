font_size 16

hide_window_decorations yes
window_padding_width 10
modify_font cell_height 120%
tab_bar_edge top
allow_remote_control yes

# Session management
startup_session ~/.local/share/kitty/sessions/home.kitty-session
tab_bar_filter session:~ or session:^$

# BEGIN_KITTY_KEYMAPS
map cmd+enter new_window_with_cwd
map cmd+t new_tab_with_cwd
map cmd+n new_os_window_with_cwd
map ctrl+shift+o goto_session ~/.local/share/kitty/sessions/



# BEGIN_KITTY_FONTS
font_family      family="Agave Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


# BEGIN_KITTY_THEME
# Catppuccin Kitty Frappé
include current-theme.conf
# END_KITTY_THEME
